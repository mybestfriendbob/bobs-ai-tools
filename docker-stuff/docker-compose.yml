version: '3.8'

services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama-engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    devices:
      - "nvidia.com/gpu=all"
    security_opt:
      - "label=disable"
    volumes:
      - ollama_data:/root/.ollama:Z

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open-webui_data:/app/backend/data:Z
    depends_on:
      - ollama

volumes:
  ollama_data:
  open-webui_data: